[package]
name = "a2rl-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:serde_json"]

[[bin]]
name = "a2rl-sim"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
glam = "0.32"
serde_json = { version = "1", optional = true }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
lto = "thin"
