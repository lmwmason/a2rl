<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2RL FPV Simulator</title>
<style>
:root{color-scheme:dark;--bg:#0c111a;--panel:#111a28;--line:#253247;--ink:#ecf4fb;--dim:#a5b4c8;--mint:#62ecbe;--violet:#a88af9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% 0%,#182439,var(--bg) 57%);font:15px system-ui,sans-serif;color:var(--ink)}
main{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,54px) 40px}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:23px}
h1{font-size:clamp(26px,4vw,42px);font-weight:760;letter-spacing:-.05em;margin:0}h1 b{color:var(--mint);font-weight:inherit}
p{margin:0;color:var(--dim)}.status{padding:8px 12px;border:1px solid var(--line);border-radius:7px;color:var(--mint);white-space:nowrap;font-weight:650}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(265px,330px);gap:17px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px}
h2{font-size:15px;line-height:1.3;margin:0}.mono{font:600 12px ui-monospace,monospace;color:var(--dim);letter-spacing:.04em}
.camera{position:relative;background:#111c2b;display:grid;place-items:center}.camera canvas{display:block;width:100%;height:auto;aspect-ratio:4/3}
#notice{position:absolute;bottom:14px;left:14px;max-width:calc(100% - 28px);background:#0c1725e8;color:#e5effa;padding:9px 13px;border-radius:6px}
#notice[hidden]{display:none}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.metric{padding:12px 16px}.metric+.metric{border-left:1px solid var(--line)}
.value{font:600 clamp(17px,2vw,25px) ui-monospace,monospace;display:block;margin:5px 0 0;color:var(--ink);white-space:nowrap}.value small{font-size:11px;color:var(--dim)}
aside{display:grid;gap:15px;align-content:start}.map{margin:0 12px 12px;background:#0c1522;border-radius:8px;overflow:hidden}
#course{display:block;width:100%;height:auto}.timing{display:grid;gap:10px;padding:0 17px 15px}.row{display:flex;justify-content:space-between;align-items:center;color:var(--dim)}
.row strong{font:650 15px ui-monospace,monospace;color:var(--ink)}.row:last-child strong{color:var(--mint)}
.controls{padding:0 17px 16px}.keys{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;color:var(--dim);margin:2px 0 17px}
kbd{display:inline-block;padding:3px 7px;background:#172337;border:1px solid #31415b;border-bottom-width:2px;border-radius:5px;color:var(--ink);font:650 11px ui-monospace,monospace}.buttons{display:flex;gap:8px}
button{border:1px solid #324358;border-radius:7px;padding:9px 13px;background:#182539;color:var(--ink);font:650 14px system-ui;cursor:pointer}button.primary{background:var(--mint);color:#0a2420;border-color:var(--mint);flex:1}button:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
button:disabled{opacity:.55;cursor:default}.sub{font-size:12px;color:var(--dim);margin-top:13px}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}aside{grid-template-columns:1fr 1fr}aside .card:last-child{grid-column:1/-1}}
@media(max-width:500px){main{padding-top:18px}.head{margin-bottom:15px}.layout,aside{gap:10px}aside{grid-template-columns:1fr}.metric{padding:9px}.status{font-size:11px}}
</style>
</head>
<body><main>
  <header class="head"><h1><b>A2RL</b> FPV 시뮬레이터</h1><span class="status" id="status">연결 중</span></header>
  <div class="layout">
    <section class="card" aria-label="FPV 비행 화면">
      <div class="top"><h2>전방 카메라</h2><span class="mono">RGB · 155° × 115°</span></div>
      <div class="camera"><canvas id="camera" width="640" height="480" aria-label="드론 시점"></canvas><p id="notice" aria-live="polite">시뮬레이터 연결 중</p></div>
      <div class="metrics">
        <div class="metric"><p>속도</p><strong class="value"><span id="speed">0.0</span> <small>km/h</small></strong></div>
        <div class="metric"><p>고도</p><strong class="value"><span id="height">2.6</span> <small>m</small></strong></div>
        <div class="metric"><p>다음 게이트</p><strong class="value" id="gate">01 / 12</strong></div>
      </div>
    </section>
    <aside>
      <section class="card"><div class="top"><h2>코스 지도</h2><span class="mono">실내 순환 코스</span></div>
        <div class="map"><canvas id="course" width="320" height="220" aria-label="게이트와 드론 위치"></canvas></div>
      </section>
      <section class="card"><div class="top"><h2>랩 타이밍</h2><span class="mono"><span id="laps">0</span> LAP</span></div>
        <div class="timing">
          <div class="row">현재 랩 <strong id="time">0.00 s</strong></div>
          <div class="row">이전 랩 <strong id="last">—</strong></div>
          <div class="row">최고 기록 <strong id="best">—</strong></div>
        </div>
      </section>
      <section class="card"><div class="top"><h2>Mode 2 Acro</h2><span class="mono">스로틀 <span id="throttle">—</span></span></div>
        <div class="controls"><div class="keys">
          <span>스로틀 증가 / 감소</span><span><kbd>W</kbd> <kbd>S</kbd></span>
          <span>요 왼쪽 / 오른쪽</span><span><kbd>A</kbd> <kbd>D</kbd></span>
          <span>피치 앞 / 뒤</span><span><kbd>↑</kbd> <kbd>↓</kbd></span>
          <span>롤 왼쪽 / 오른쪽</span><span><kbd>←</kbd> <kbd>→</kbd></span>
        </div>
        <div class="buttons"><button class="primary" id="play" disabled>비행 시작</button><button id="reset" disabled>리셋</button></div>
        <p class="sub">2025 A2RL 기체 프로필 · 966 g</p></div>
      </section>
    </aside>
  </div>
</main><script type="module" src="/app.js"></script></body></html>
